<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1f2a24">
<title>Kitchen Line</title>
<style>
  :root {
    --brand: #c2562d;
    --bg: #f6f3ee;
    --card: #ffffff;
    --ink: #1f2a24;
    --muted: #6b726d;
    --line: #e4ded4;
    --good: #2f7d4f;
    --warn: #b7791f;
    --bad: #b33a3a;
    --radius: 14px;
    --head: #1f2a24;
    --head-ink: #ffffff;
    --head-muted: #b9c0bb;
    --overlay: rgba(0,0,0,.45);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #141816; --card: #1d2320; --ink: #eef0ec; --muted: #9aa39d; --line: #2e3631;
      --head: #0d100e; color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #141816; --card: #1d2320; --ink: #eef0ec; --muted: #9aa39d; --line: #2e3631;
    --head: #0d100e; color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: var(--bg); color: var(--ink);
    font: 16px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    padding-bottom: calc(76px + env(safe-area-inset-bottom));
  }
  body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--head); }
  header.top {
    position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5;
    background: var(--head); color: var(--head-ink);
    padding-block: 14px;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    display: flex; align-items: center; gap: 10px;
  }
  .logo {
    width: 34px; height: 34px; border-radius: 10px; background: var(--brand);
    display: grid; place-items: center; font-weight: 800; font-size: 15px; color: #fff; flex: none;
  }
  header.top h1 { font-size: 17px; margin: 0; line-height: 1.1; }
  header.top small { color: var(--head-muted); font-size: 12px; }
  main { max-width: 760px; margin: 0 auto; padding-block: 16px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
  nav.tabs {
    position: fixed; bottom: 0; left: 0; right: 0; z-index: 5;
    background: var(--card); border-top: 1px solid var(--line);
    display: flex; padding-bottom: env(safe-area-inset-bottom);
  }
  nav.tabs button {
    flex: 1; background: none; border: 0; padding: 10px 4px 12px; color: var(--muted);
    font-size: 12px; font-weight: 600; display: flex; flex-direction: column; align-items: center; gap: 3px;
  }
  nav.tabs button span { font-size: 20px; line-height: 1; }
  nav.tabs button.on { color: var(--brand); }
  h2 { font-size: 22px; margin: 4px 0 12px; }
  h3 { font-size: 16px; margin: 0 0 10px; }
  .card {
    background: var(--card); border: 1px solid var(--line); border-radius: var(--radius);
    padding: 14px; margin-bottom: 12px;
  }
  .row { display: flex; gap: 10px; align-items: center; }
  .row.wrap { flex-wrap: wrap; }
  .grow { flex: 1; min-width: 0; }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .grid3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; }
  @media (max-width: 420px) { .grid3 { grid-template-columns: 1fr 1fr; } }
  label { display: block; font-size: 12px; font-weight: 600; color: var(--muted); margin-bottom: 4px; }
  input, select, textarea {
    width: 100%; font: inherit; color: var(--ink); background: var(--bg);
    border: 1px solid var(--line); border-radius: 10px; padding: 10px; min-height: 44px;
  }
  textarea { min-height: 70px; resize: vertical; }
  input:focus, select:focus, textarea:focus { outline: 2px solid var(--brand); border-color: transparent; }
  .btn {
    font: inherit; font-weight: 600; border: 0; border-radius: 10px; padding: 11px 14px; min-height: 44px;
    background: var(--brand); color: #fff; cursor: pointer;
  }
  .btn.ghost { background: transparent; color: var(--ink); border: 1px solid var(--line); }
  .btn.small { padding: 6px 10px; min-height: 34px; font-size: 14px; }
  .btn.danger { background: transparent; color: var(--bad); border: 1px solid var(--line); }
  .btn.block { width: 100%; }
  .muted { color: var(--muted); }
  .small { font-size: 13px; }
  .pill {
    display: inline-block; font-size: 11px; font-weight: 700; letter-spacing: .02em;
    padding: 3px 8px; border-radius: 99px; background: var(--bg); border: 1px solid var(--line);
  }
  .pill.Inquiry { color: var(--warn); }
  .pill.Quoted { color: #3a6db3; }
  .pill.Booked { color: var(--good); }
  .pill.Done { color: var(--muted); }
  .event-item { cursor: pointer; }
  .event-item .date {
    width: 52px; text-align: center; flex: none; border-radius: 10px; background: var(--bg); padding: 6px 0;
  }
  .event-item .date b { display: block; font-size: 20px; line-height: 1; }
  .event-item .date span { font-size: 11px; text-transform: uppercase; color: var(--muted); font-weight: 700; }
  .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 12px; }
  .stat { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 10px; }
  .stat b { display: block; font-size: 18px; }
  .stat span { font-size: 11px; color: var(--muted); font-weight: 600; }
  .seg { display: flex; gap: 6px; overflow-x: auto; margin-bottom: 12px; padding-bottom: 2px; }
  .seg button {
    flex: none; font: inherit; font-size: 14px; font-weight: 600; border: 1px solid var(--line);
    background: var(--card); color: var(--ink); border-radius: 99px; padding: 7px 13px;
  }
  .seg button.on { background: var(--ink); color: var(--bg); border-color: var(--ink); }
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  td, th { padding: 7px 4px; border-bottom: 1px solid var(--line); text-align: left; vertical-align: top; }
  th { font-size: 12px; color: var(--muted); }
  td.num, th.num { text-align: right; white-space: nowrap; }
  tr.total td { font-weight: 800; border-bottom: 0; font-size: 16px; }
  .check { display: flex; gap: 10px; align-items: flex-start; padding: 8px 0; border-bottom: 1px solid var(--line); }
  .check:last-child { border-bottom: 0; }
  .check input { width: 22px; height: 22px; min-height: 0; flex: none; margin-top: 1px; accent-color: var(--brand); }
  .check.done span { text-decoration: line-through; color: var(--muted); }
  .dish-pick { display: flex; gap: 10px; align-items: center; padding: 8px 0; border-bottom: 1px solid var(--line); }
  .dish-pick input { width: 22px; height: 22px; min-height: 0; flex: none; accent-color: var(--brand); }
  .ing { display: grid; grid-template-columns: 1.6fr .8fr .8fr 1fr 34px; gap: 6px; margin-bottom: 6px; }
  .ing input { padding: 8px; min-height: 40px; font-size: 14px; }
  .xbtn { background: none; border: 0; color: var(--muted); font-size: 20px; cursor: pointer; }
  .big { font-size: 26px; font-weight: 800; }
  .back { background: none; border: 0; color: var(--brand); font: inherit; font-weight: 600; padding: 4px 0; margin-bottom: 6px; cursor: pointer; }
  .empty { text-align: center; padding: 30px 10px; color: var(--muted); }
  .fab {
    position: fixed; right: calc(16px + env(safe-area-inset-right, 0px)); bottom: calc(86px + env(safe-area-inset-bottom)); z-index: 4;
    width: 56px; height: 56px; border-radius: 50%; font-size: 28px; padding: 0;
    box-shadow: 0 6px 18px rgba(0,0,0,.2);
  }
  .note { font-size: 13px; color: var(--muted); background: var(--bg); border-radius: 10px; padding: 10px; }
  .swatches { display: flex; gap: 8px; flex-wrap: wrap; }
  .swatches button { width: 36px; height: 36px; border-radius: 50%; border: 3px solid transparent; cursor: pointer; }
  .swatches button.on { border-color: var(--ink); }

  .sheet { position: fixed; inset: 0; z-index: 20; background: var(--overlay); overflow-y: auto; padding: calc(16px + env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) calc(16px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
  .sheet .paper { background: #fff; color: #1a1a1a; max-width: 640px; margin: 0 auto; border-radius: var(--radius); padding: 22px; }
  .sheet .bar { max-width: 640px; margin: 0 auto 10px; display: flex; gap: 8px; flex-wrap: wrap; }
  .qdoc .ph { border-bottom: 3px solid var(--brand); padding-bottom: 10px; margin-bottom: 16px; display: flex; justify-content: space-between; align-items: flex-end; gap: 12px; flex-wrap: wrap; }
  .qdoc h1 { margin: 0; font-size: 26px; color: var(--brand); }
  .qdoc h2 { font-size: 17px; margin: 18px 0 6px; color: var(--brand); }
  .qdoc .course { font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: #777; margin-top: 10px; }
  .qdoc .dish { font-size: 16px; margin: 2px 0; }
  .qdoc td { border-bottom: 1px solid #ddd; color: #1a1a1a; }
  .qdoc .foot { margin-top: 20px; font-size: 12px; color: #555; }
  /* ---------- Printable client quote ---------- */
  #print { display: none; }
  @media print {
    body { background: #fff; color: #000; padding: 0; }
    header.top, nav.tabs, main, .fab, .sheet { display: none !important; }
    body::before { display: none; }
    #print { display: block; padding: 10mm 14mm; font-size: 12pt; }
    #print .ph { border-bottom: 3px solid var(--brand); padding-bottom: 10px; margin-bottom: 18px; display: flex; justify-content: space-between; align-items: flex-end; }
    #print h1 { margin: 0; font-size: 26pt; color: var(--brand); }
    #print h2 { font-size: 14pt; margin: 18px 0 6px; color: var(--brand); }
    #print .course { font-size: 9pt; letter-spacing: .12em; text-transform: uppercase; color: #777; margin-top: 10px; }
    #print .dish { font-size: 13pt; margin: 2px 0; }
    #print table td { border-bottom: 1px solid #ddd; }
    #print .foot { margin-top: 24px; font-size: 9pt; color: #555; }
  }
</style>
</head>
<body>

<header class="top">
  <div class="logo" id="logo">KL</div>
  <div class="grow">
    <h1 id="brandName">Kitchen Line</h1>
    <small id="brandTag">Private chef · Pop-ups · Market booths</small>
  </div>
</header>

<main id="app"></main>
<div id="print"></div>

<nav class="tabs">
  <button data-tab="events" class="on"><span>📅</span>Events</button>
  <button data-tab="menu"><span>🍽️</span>Dishes</button>
  <button data-tab="money"><span>💰</span>Money</button>
  <button data-tab="brand"><span>⚙️</span>Brand</button>
</nav>

<script>
/* =========================================================
   KITCHEN LINE — event tool for private chefs, pop-ups & booths
   All your data is saved on this device (browser storage).
   Use Brand > Backup to download a copy.
   ========================================================= */

// Default brand. Change it in the app (Brand tab) — no code needed.
const DEFAULT_BRAND = {
  name: "Kitchen Line",
  tagline: "Private chef · Pop-ups · Market booths",
  chef: "",
  phone: "",
  email: "",
  instagram: "",
  color: "#c2562d",
  currency: "$",
  terms: "A deposit is required to secure the date. Final guest count and dietary needs due 7 days before the event. Price includes shopping, cooking, service and kitchen clean-up."
};

const EVENT_TYPES = {
  "Private Dinner": { icon: "🕯️", mode: "quote" },
  "Pop-Up":         { icon: "⛺", mode: "plates" },
  "Market Booth":   { icon: "🧺", mode: "plates" },
  "Catering":       { icon: "🥂", mode: "quote" },
  "Cooking Class":  { icon: "👩‍🍳", mode: "quote" },
};
const STATUSES = ["Inquiry", "Quoted", "Booked", "Done"];
const COURSES = ["Canapé", "Starter", "Main", "Side", "Dessert", "Drink", "Booth item"];

const PACKING = {
  "Private Dinner": ["Knife roll", "Chef jacket + apron", "Cutting boards", "Mise en place containers", "Piping bags / squeeze bottles", "Plating tweezers & spoons", "Finishing salt & oils", "Torch / thermometer", "Towels & cloths", "Gloves", "Ice packs / cooler", "Printed menu cards", "Trash bags"],
  "Pop-Up": ["Knife roll", "Chef jackets for team", "Hotel pans & lids", "Induction burners + extension cords", "Sheet pans", "Plates / bowls / cutlery", "Menu board / signage", "Card reader (charged)", "Cash float", "Tickets / order rail", "Hand wash station", "Food safety thermometer", "Sanitiser & cloths", "Trash & recycling bags"],
  "Market Booth": ["Gazebo / tent + weights", "Folding tables (x2)", "Table cloth + banner", "Price board / menu sign", "Burner / griddle + gas", "Fire extinguisher", "Takeaway boxes, napkins, forks", "Card reader (charged)", "Cash float & cash box", "Coolers + ice", "Hand wash station", "Trader permit & food hygiene certificate", "Hi-vis / gloves / hairnets", "Trash bags", "Phone charger / power bank"],
  "Catering": ["Chafing dishes + fuel", "Hotel pans", "Serving utensils", "Platters & risers", "Labels with allergens", "Hot boxes / cambros", "Coolers + ice", "Linen", "Gloves", "Thermometer", "Trash bags"],
  "Cooking Class": ["Ingredient kits per guest", "Aprons for guests", "Recipe handouts", "Knives & boards per station", "Burners", "Towels", "Tasting spoons"],
};

// In-page "tap again to confirm" (pop-up dialogs aren't available everywhere).
function armed(btn, label, action) {
  btn.onclick = () => {
    if (btn.dataset.armed) return action();
    const orig = btn.textContent; btn.dataset.armed = "1"; btn.textContent = label;
    setTimeout(() => { delete btn.dataset.armed; btn.textContent = orig; }, 3000);
  };
}
const FRAMED = (() => { try { return window.self !== window.top; } catch (_) { return true; } })();
const uid = () => Math.random().toString(36).slice(2, 10);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const num = v => { const n = parseFloat(v); return isFinite(n) ? n : 0; };

/* ---------------- Storage ---------------- */
const KEY = "kitchen-line-v1";
let S;
function seed() {
  const d1 = { id: uid(), name: "Seared scallop, cauliflower, brown butter", course: "Starter", allergens: "Shellfish, Dairy", notes: "",
    ingredients: [ { name: "Scallops", qty: 3, unit: "pc", cost: 1.6 }, { name: "Cauliflower", qty: 0.15, unit: "kg", cost: 3 }, { name: "Butter", qty: 0.03, unit: "kg", cost: 9 } ] };
  const d2 = { id: uid(), name: "Braised short rib, mash, red wine jus", course: "Main", allergens: "Dairy, Celery, Sulphites", notes: "Braise day before",
    ingredients: [ { name: "Short rib", qty: 0.3, unit: "kg", cost: 18 }, { name: "Potatoes", qty: 0.25, unit: "kg", cost: 1.5 }, { name: "Red wine", qty: 0.1, unit: "L", cost: 10 }, { name: "Cream", qty: 0.05, unit: "L", cost: 4 } ] };
  const d3 = { id: uid(), name: "Dark chocolate tart, crème fraîche", course: "Dessert", allergens: "Gluten, Dairy, Egg", notes: "",
    ingredients: [ { name: "Dark chocolate", qty: 0.06, unit: "kg", cost: 16 }, { name: "Pastry", qty: 0.07, unit: "kg", cost: 6 }, { name: "Crème fraîche", qty: 0.03, unit: "kg", cost: 8 } ] };
  const d4 = { id: uid(), name: "Smash burger + fries", course: "Booth item", allergens: "Gluten, Dairy, Mustard", notes: "Sell price 14",
    ingredients: [ { name: "Beef mince", qty: 0.15, unit: "kg", cost: 12 }, { name: "Brioche bun", qty: 1, unit: "pc", cost: 0.6 }, { name: "Cheese slice", qty: 2, unit: "pc", cost: 0.2 }, { name: "Fries", qty: 0.2, unit: "kg", cost: 2.5 } ] };
  const today = new Date(); today.setDate(today.getDate() + 10);
  const ev = blankEvent("Private Dinner");
  Object.assign(ev, { title: "Anniversary dinner — Sample", client: "Sample client", guests: 8, date: today.toISOString().slice(0, 10), time: "19:00",
    status: "Quoted", dishIds: [d1.id, d2.id, d3.id], location: "Client's home", dietary: "1 guest no shellfish" });
  return { brand: { ...DEFAULT_BRAND }, dishes: [d1, d2, d3, d4], events: [ev] };
}
function load() {
  try { const raw = localStorage.getItem(KEY); if (raw) { const d = JSON.parse(raw); d.brand = { ...DEFAULT_BRAND, ...d.brand }; return d; } } catch (e) {}
  return seed();
}
function save() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} }

function blankEvent(type = "Private Dinner") {
  return {
    id: uid(), title: "", type, status: "Inquiry", date: "", time: "", client: "", phone: "", email: "", location: "",
    guests: (EVENT_TYPES[type] || {}).mode === "plates" ? 60 : 10, dietary: "", notes: "", dishIds: [],
    // costs
    chefHours: 8, chefRate: 35, staffCount: 0, staffHours: 6, staffRate: 22, travel: 0, rentals: 0, extras: 0, wastePct: 10,
    // pricing
    markupPct: 60, pricePerHead: "", platePrice: 14, depositPct: 50, depositPaid: false, paidInFull: false, stallFee: 0,
    // checklists
    packing: (PACKING[type] || []).map(t => ({ t, d: false })), tasks: [], bought: {}
  };
}

/* ---------------- Maths ---------------- */
const money = v => S.brand.currency + (Math.round(v * 100) / 100).toLocaleString(undefined, { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const dishCost = d => (d.ingredients || []).reduce((a, i) => a + num(i.qty) * num(i.cost), 0);
const dishById = id => S.dishes.find(d => d.id === id);

function calc(e) {
  const dishes = e.dishIds.map(dishById).filter(Boolean);
  const perPortion = dishes.reduce((a, d) => a + dishCost(d), 0);
  const guests = num(e.guests);
  const food = perPortion * guests * (1 + num(e.wastePct) / 100);
  const labour = num(e.chefHours) * num(e.chefRate) + num(e.staffCount) * num(e.staffHours) * num(e.staffRate);
  const other = num(e.travel) + num(e.rentals) + num(e.extras) + num(e.stallFee);
  const cost = food + labour + other;
  const mode = (EVENT_TYPES[e.type] || {}).mode || "quote";
  let revenue, perHead;
  if (mode === "plates") {
    perHead = num(e.platePrice);
    revenue = perHead * guests;
  } else {
    perHead = e.pricePerHead !== "" && e.pricePerHead != null ? num(e.pricePerHead) : (guests ? cost * (1 + num(e.markupPct) / 100) / guests : 0);
    perHead = Math.ceil(perHead);
    revenue = perHead * guests;
  }
  const profit = revenue - cost;
  const margin = revenue ? profit / revenue * 100 : 0;
  const foodPct = revenue ? food / revenue * 100 : 0;
  const deposit = revenue * num(e.depositPct) / 100;
  // break-even plates for booth/pop-up
  const unitFood = perPortion * (1 + num(e.wastePct) / 100);
  const fixed = labour + other;
  const breakEven = perHead > unitFood ? Math.ceil(fixed / (perHead - unitFood)) : null;
  return { dishes, perPortion, food, labour, other, cost, revenue, perHead, profit, margin, foodPct, deposit, breakEven, mode };
}

function shopping(e) {
  const map = {};
  const mult = num(e.guests) * (1 + num(e.wastePct) / 100);
  e.dishIds.map(dishById).filter(Boolean).forEach(d => (d.ingredients || []).forEach(i => {
    if (!i.name) return;
    const k = i.name.trim().toLowerCase() + "|" + (i.unit || "").trim().toLowerCase();
    map[k] = map[k] || { name: i.name.trim(), unit: i.unit, qty: 0, cost: 0, key: k };
    map[k].qty += num(i.qty) * mult;
    map[k].cost += num(i.qty) * num(i.cost) * mult;
  }));
  return Object.values(map).sort((a, b) => a.name.localeCompare(b.name));
}
const fmtQty = q => q >= 10 ? Math.ceil(q * 10) / 10 : Math.ceil(q * 100) / 100;

/* ---------------- Router / UI ---------------- */
let view = { tab: "events", eventId: null, sub: "details", dishId: null, filter: "Upcoming" };
const app = document.getElementById("app");

function applyBrand() {
  const b = S.brand;
  document.documentElement.style.setProperty("--brand", b.color || DEFAULT_BRAND.color);
  document.getElementById("brandName").textContent = b.name || "My Kitchen";
  document.getElementById("brandTag").textContent = b.tagline || "";
  document.getElementById("logo").textContent = (b.name || "K").split(/\s+/).map(w => w[0]).join("").slice(0, 2).toUpperCase();
  document.title = b.name || "Kitchen Line";
}

function render() {
  applyBrand();
  document.querySelectorAll("nav.tabs button").forEach(b => b.classList.toggle("on", b.dataset.tab === view.tab));
  document.querySelectorAll(".fab").forEach(f => f.remove());
  if (view.tab === "events") view.eventId ? renderEvent() : renderEvents();
  else if (view.tab === "menu") view.dishId ? renderDish() : renderDishes();
  else if (view.tab === "money") renderMoney();
  else renderBrand();
  window.scrollTo(0, 0);
}
function fab(onclick) {
  const b = document.createElement("button"); b.className = "btn fab"; b.textContent = "+"; b.setAttribute("aria-label", "Add");
  b.onclick = onclick; document.body.appendChild(b);
}

/* ----- Events list ----- */
function renderEvents() {
  const todayStr = new Date().toISOString().slice(0, 10);
  const filters = ["Upcoming", ...STATUSES, "All"];
  let list = [...S.events].sort((a, b) => (a.date || "9999").localeCompare(b.date || "9999"));
  if (view.filter === "Upcoming") list = list.filter(e => e.status !== "Done" && (!e.date || e.date >= todayStr));
  else if (view.filter !== "All") list = list.filter(e => e.status === view.filter);

  const booked = S.events.filter(e => e.status === "Booked" || e.status === "Done");
  const pipeline = S.events.filter(e => e.status === "Inquiry" || e.status === "Quoted").reduce((a, e) => a + calc(e).revenue, 0);
  const next = [...S.events].filter(e => e.date >= todayStr && e.status !== "Done").sort((a, b) => a.date.localeCompare(b.date))[0];

  app.innerHTML = `
    <div class="stats">
      <div class="stat"><b>${S.events.filter(e => e.status === "Booked").length}</b><span>Booked gigs</span></div>
      <div class="stat"><b>${money(pipeline)}</b><span>In pipeline</span></div>
      <div class="stat"><b>${next ? daysUntil(next.date) : "—"}</b><span>${next ? "Next gig" : "No gigs yet"}</span></div>
    </div>

/* ----- Single event ----- */
function bindFields(root, obj, after) {
  root.querySelectorAll("[data-k]").forEach(el => {
    const ev = el.type === "checkbox" || el.tagName === "SELECT" ? "change" : "input";
    el.addEventListener(ev, () => {
      obj[el.dataset.k] = el.type === "checkbox" ? el.checked : el.value;
      save(); after && after(el.dataset.k);
    });
  });
}
function field(obj, k, lbl, type = "text", extra = "") {
  return `<div><label>${lbl}</label><input type="${type}" data-k="${k}" value="${esc(obj[k])}" ${type === "number" ? 'inputmode="decimal" step="any"' : ""} ${extra}></div>`;
}

function renderEvent() {

let rt; function debounceRender() {
  clearTimeout(rt);
  rt = setTimeout(() => {
    const a = document.activeElement, k = a && a.dataset && a.dataset.k, pos = a && a.selectionStart;
    render();
    if (k) { const el = app.querySelector(`[data-k="${k}"]`); if (el) { el.focus(); try { el.setSelectionRange(pos, pos); } catch (_) {} el.scrollIntoView({ block: "center" }); } }
  }, 700);
}

function showCopyBox(t) {
  const sh = document.createElement("div"); sh.className = "sheet";
  sh.innerHTML = `<div class="card" style="max-width:640px;margin:0 auto"><h3>Copy this text</h3><textarea style="min-height:240px" readonly></textarea><button class="btn block" style="margin-top:10px">Done</button></div>`;
  const ta = sh.querySelector("textarea"); ta.value = t;
  sh.querySelector("button").onclick = () => sh.remove();
  document.body.appendChild(sh); ta.focus(); ta.select();
}
function copyText(t, btn) {
  const done = () => { const o = btn.textContent; btn.textContent = "✓ Copied"; setTimeout(() => btn.textContent = o, 1500); };
  const fallback = () => showCopyBox(t);
  try { if (navigator.clipboard) navigator.clipboard.writeText(t).then(done, fallback); else fallback(); } catch (_) { fallback(); }
}

    : `<div class="empty">No dishes yet. Tap <b>+</b>.</div>`}`;
  app.querySelectorAll("[data-dish]").forEach(r => r.onclick = () => { view.dishId = r.dataset.dish; render(); });
  fab(() => { const d = newDish(); view.dishId = d.id; render(); });
}
function renderDish() {
  const d = dishById(view.dishId);
  if (!d) { view.dishId = null; return render(); }
  const ingRows = () => d.ingredients.map((i, n) => `<div class="ing">
      <input placeholder="Ingredient" data-i="${n}" data-f="name" value="${esc(i.name)}">
      <input placeholder="Qty" inputmode="decimal" data-i="${n}" data-f="qty" value="${esc(i.qty)}">
      <input placeholder="Unit" data-i="${n}" data-f="unit" value="${esc(i.unit)}">
      <input placeholder="Cost/unit" inputmode="decimal" data-i="${n}" data-f="cost" value="${esc(i.cost)}">
      <button class="xbtn" data-xi="${n}" aria-label="Remove">×</button></div>`).join("");
  app.innerHTML = `<button class="back" id="bk">‹ Dishes</button>
  <div class="card">
    ${field(d, "name", "Dish name")}
    <div class="grid2" style="margin-top:10px">
      <div><label>Course</label><select data-k="course">${COURSES.map(c => `<option ${c === d.course ? "selected" : ""}>${c}</option>`).join("")}</select></div>
      ${field(d, "allergens", "Allergens")}
    </div>
  </div>
  <div class="card"><div class="row"><h3 class="grow" style="margin:0">Ingredients per portion</h3><b id="dc">${money(dishCost(d))}</b></div>
    <div class="small muted" style="margin:6px 0 10px">e.g. Short rib · 0.3 · kg · 18 (price per kg)</div>
    <div class="ing small muted" style="font-weight:600"><span>Name</span><span>Qty</span><span>Unit</span><span>${esc(S.brand.currency)}/unit</span><span></span></div>
    <div id="ings">${ingRows()}</div>
    <button class="btn ghost small" id="addi">+ Ingredient</button>
  </div>
  <div class="card"><label>Prep notes / method</label><textarea data-k="notes" placeholder="e.g. Braise day before, plate with micro herbs">${esc(d.notes)}</textarea></div>
  <div class="row" style="gap:8px"><button class="btn grow" id="done">Done</button><button class="btn danger" id="del">Delete</button></div>`;
  bindFields(app, d);
  const wireIngs = () => {
    app.querySelectorAll("[data-i]").forEach(el => el.oninput = () => { d.ingredients[+el.dataset.i][el.dataset.f] = el.value; save(); app.querySelector("#dc").textContent = money(dishCost(d)); });
    app.querySelectorAll("[data-xi]").forEach(b => b.onclick = () => { d.ingredients.splice(+b.dataset.xi, 1); save(); app.querySelector("#ings").innerHTML = ingRows(); wireIngs(); app.querySelector("#dc").textContent = money(dishCost(d)); });
  };
  wireIngs();
  app.querySelector("#addi").onclick = () => { d.ingredients.push({ name: "", qty: "", unit: "", cost: "" }); save(); app.querySelector("#ings").innerHTML = ingRows(); wireIngs(); const all = app.querySelectorAll('[data-f="name"]'); all[all.length - 1].focus(); };
  const back = () => { view.dishId = null; render(); };
  app.querySelector("#bk").onclick = back; app.querySelector("#done").onclick = back;
  armed(app.querySelector("#del"), "Tap again", () => {
    S.dishes = S.dishes.filter(x => x !== d); S.events.forEach(e => e.dishIds = e.dishIds.filter(id => id !== d.id)); save(); back();
  });
}

/* ----- Money overview ----- */
function renderMoney() {
  const yr = new Date().getFullYear();
  const rows = S.events.filter(e => (e.status === "Booked" || e.status === "Done") && (e.date || "").startsWith(String(yr)));
  const tot = rows.reduce((a, e) => { const c = calc(e); a.rev += c.revenue; a.cost += c.cost; a.profit += c.profit; return a; }, { rev: 0, cost: 0, profit: 0 });
  const owed = S.events.filter(e => (e.status === "Booked" || e.status === "Done") && !e.paidInFull && calc(e).mode === "quote");
  const byType = {};
  rows.forEach(e => { const c = calc(e); byType[e.type] = byType[e.type] || { n: 0, profit: 0 }; byType[e.type].n++; byType[e.type].profit += c.profit; });
  app.innerHTML = `<h2>Money · ${yr}</h2>
  <div class="stats">
    <div class="stat"><b>${money(tot.rev)}</b><span>Takings</span></div>
    <div class="stat"><b>${money(tot.profit)}</b><span>Profit</span></div>
    <div class="stat"><b>${rows.length}</b><span>Gigs</span></div>
  </div>
  <div class="card"><h3>What earns most</h3>
    ${Object.keys(byType).length ? `<table><tr><th>Type</th><th class="num">Gigs</th><th class="num">Profit</th><th class="num">Avg / gig</th></tr>
    ${Object.entries(byType).sort((a, b) => b[1].profit - a[1].profit).map(([t, v]) => `<tr><td>${EVENT_TYPES[t]?.icon || ""} ${esc(t)}</td><td class="num">${v.n}</td><td class="num">${money(v.profit)}</td><td class="num">${money(v.profit / v.n)}</td></tr>`).join("")}</table>`
    : `<div class="muted small">Mark events as Booked or Done to see this.</div>`}
  </div>
  <div class="card"><h3>Waiting for payment</h3>
    ${owed.length ? owed.map(e => { const c = calc(e); return `<div class="row" style="padding:8px 0;border-bottom:1px solid var(--line);cursor:pointer" data-ev="${e.id}">
      <div class="grow">${esc(e.title || e.client || e.type)}<div class="small muted">${e.date || "No date"} · ${e.depositPaid ? "deposit paid" : "<span style='color:var(--bad)'>no deposit yet</span>"}</div></div>
      <b>${money(e.depositPaid ? c.revenue - c.deposit : c.revenue)}</b></div>`; }).join("") : `<div class="muted small">All paid up 🎉</div>`}
  </div>`;
  app.querySelectorAll("[data-ev]").forEach(r => r.onclick = () => { view.tab = "events"; view.eventId = r.dataset.ev; view.sub = "costing"; render(); });
}

/* ----- Brand / settings ----- */
const COLORS = ["#c2562d", "#1f6f5c", "#8a3b5c", "#2d4fa1", "#b8892b", "#1f2a24", "#6b4fbb", "#d14b4b"];
function renderBrand() {
  const b = S.brand;
  app.innerHTML = `<h2>Your brand</h2>
  <p class="muted small" style="margin-top:-6px">Everything here appears on your client quotes. Change it any time you rebrand.</p>
  <div class="card">
    ${field(b, "name", "Business name")}
    <div style="margin-top:10px">${field(b, "tagline", "Tagline")}</div>
    <div style="margin-top:10px"><label>Brand colour</label><div class="swatches">${COLORS.map(c => `<button style="background:${c}" class="${c === b.color ? "on" : ""}" data-c="${c}" aria-label="${c}"></button>`).join("")}
      <input type="color" data-k="color" value="${esc(b.color)}" style="width:44px;height:36px;padding:2px;min-height:0"></div></div>
  </div>
  <div class="card"><h3>Contact (shown on quotes)</h3>
    <div class="grid2">${field(b, "chef", "Your name")}${field(b, "phone", "Phone", "tel")}${field(b, "email", "Email", "email")}${field(b, "instagram", "Instagram / website")}</div>
    <div class="grid2" style="margin-top:10px">${field(b, "currency", "Currency symbol")}</div>
  </div>
  <div class="card"><label>Booking terms (bottom of quotes)</label><textarea data-k="terms" style="min-height:110px">${esc(b.terms)}</textarea></div>
  <div class="card"><h3>Backup</h3>
    <p class="small muted" style="margin-top:0">Your data lives on this device only. Download a backup now and then, and use it to move to a new phone.</p>
    <div class="row wrap" style="gap:8px">
      ${FRAMED ? "" : `<button class="btn ghost" id="exp">⬇ Download backup</button>`}
      <button class="btn ghost" id="cpy">📋 Copy backup</button>
      <label class="btn ghost" style="margin:0;color:var(--ink);font-size:16px">⬆ Restore file<input type="file" accept=".json" id="imp" hidden></label>
    </div>
    <label for="paste" style="margin-top:12px">Or paste a backup here</label>
    <textarea id="paste" placeholder='{"brand":…}'></textarea>
    <button class="btn ghost small" id="restorePaste" style="margin-top:8px">Restore pasted backup</button>
    <div class="small" id="bmsg" style="margin-top:8px"></div>
  </div>`;
  bindFields(app, b, k => { if (["name", "tagline", "color"].includes(k)) applyBrand(); });
  app.querySelectorAll("[data-c]").forEach(s => s.onclick = () => { b.color = s.dataset.c; save(); render(); });
  const msg = t => app.querySelector("#bmsg").textContent = t;
  const restore = txt => { try { const d = JSON.parse(txt); if (!d.events || !d.dishes) throw 0; d.brand = { ...DEFAULT_BRAND, ...d.brand }; S = d; save(); render(); } catch (_) { msg("That isn't a valid backup."); } };
  app.querySelector("#cpy").onclick = ev => copyText(JSON.stringify(S), ev.currentTarget);
  armed(app.querySelector("#restorePaste"), "Tap again — replaces everything", () => restore(app.querySelector("#paste").value));
  const ex = app.querySelector("#exp"); if (ex) ex.onclick = () => {
    const a = document.createElement("a");
    a.href = URL.createObjectURL(new Blob([JSON.stringify(S, null, 2)], { type: "application/json" }));
    a.download = (b.name || "kitchen").replace(/\W+/g, "-").toLowerCase() + "-backup-" + new Date().toISOString().slice(0, 10) + ".json";
    a.click();
  };
  app.querySelector("#imp").onchange = ev => {
    const f = ev.target.files[0]; if (!f) return;
    f.text().then(restore);
  };
}

/* ---------------- Boot ---------------- */
S = load();
document.querySelectorAll("nav.tabs button").forEach(b => b.onclick = () => { view.tab = b.dataset.tab; view.eventId = null; view.dishId = null; render(); });
render();
</script>
</body>
</html>
