<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"></head><body>
<title>Chef on Call</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Inter:wght@400;500;600;700&display=swap">
<style>
  /* Layout: phone-first app — sticky header, one column of cards, bottom tab bar that changes per side (client / chef / plan). */
  :root {
    --bg: #f4f5f1; --card: #ffffff; --ink: #14231c; --muted: #5f6b64; --line: #e1e4dd;
    --accent: #d9921a; --accent-ink: #ffffff; --accent-soft: #fbf0dc;
    --head: #14231c; --head-ink: #f4f5f1; --head-muted: #a9b5ae;
    --good: #2c7a4b; --warn: #b26b00; --bad: #b3372f; --chip: #eceee8;
    --overlay: rgba(10, 18, 14, .55);
    --display: "Bricolage Grotesque", "Inter", system-ui, sans-serif;
    --body: "Inter", -apple-system, "Segoe UI", Roboto, sans-serif;
    --r: 16px;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0f1512; --card: #18201c; --ink: #e9eee9; --muted: #98a59d; --line: #2a342f;
      --accent-soft: #3a2c12; --head: #0a0f0c; --chip: #222b26; color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0f1512; --card: #18201c; --ink: #e9eee9; --muted: #98a59d; --line: #2a342f;
    --accent-soft: #3a2c12; --head: #0a0f0c; --chip: #222b26; color-scheme: dark;
  }
  * { box-sizing: border-box; }
  body { background: var(--bg); color: var(--ink); font: 15px/1.5 var(--body); margin: 0;
    padding-bottom: calc(74px + env(safe-area-inset-bottom, 0px)); }
  body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--head); }
  h1, h2, h3 { font-family: var(--display); letter-spacing: -.01em; text-wrap: balance; margin: 0; }
  button { font: inherit; color: inherit; cursor: pointer; }
  button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  header.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 6; background: var(--head); color: var(--head-ink);
    padding-block: 12px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
  .top-in { max-width: 720px; margin: 0 auto; display: flex; align-items: center; gap: 10px; }
  .mark { width: 32px; height: 32px; border-radius: 9px; background: var(--accent); color: var(--accent-ink); display: grid; place-items: center; font: 800 15px var(--display); flex: none; }
  .brand { font: 800 18px var(--display); }
  .side { margin-left: auto; display: flex; background: rgba(255,255,255,.08); border-radius: 99px; padding: 3px; }
  .side button { border: 0; background: none; color: var(--head-muted); font-size: 13px; font-weight: 600; padding: 6px 11px; border-radius: 99px; }
  .side button.on { background: var(--head-ink); color: var(--head); }

  main { max-width: 720px; margin: 0 auto; padding-block: 16px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: grid; gap: 14px; }
  main > * { min-width: 0; }
  nav.tabs { position: fixed; bottom: 0; left: 0; right: 0; z-index: 6; background: var(--card); border-top: 1px solid var(--line);
    display: flex; justify-content: center; padding-bottom: env(safe-area-inset-bottom, 0px);
    padding-left: env(safe-area-inset-left, 0px); padding-right: env(safe-area-inset-right, 0px); }
  nav.tabs button { flex: 1; max-width: 180px; border: 0; background: none; padding: 9px 4px 11px; font-size: 12px; font-weight: 600; color: var(--muted); display: grid; justify-items: center; gap: 2px; }
  nav.tabs button svg { width: 22px; height: 22px; }
  nav.tabs button.on { color: var(--accent); }
  .badge-dot { background: var(--bad); color: #fff; border-radius: 99px; font-size: 10px; padding: 0 5px; margin-left: 3px; }

  .card { background: var(--card); border: 1px solid var(--line); border-radius: var(--r); padding: 16px; }
  .stack { display: grid; gap: 10px; }
  .row { display: flex; gap: 10px; align-items: center; }
  .wrap { flex-wrap: wrap; }
  .grow { flex: 1; min-width: 0; }
  .muted { color: var(--muted); }
  .sm { font-size: 13px; }
  .xs { font-size: 12px; }
  .num { font-variant-numeric: tabular-nums; }
  .eyebrow { font-size: 11px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
  .chip { display: inline-flex; align-items: center; gap: 4px; font-size: 12px; font-weight: 600; padding: 4px 9px; border-radius: 99px; background: var(--chip); white-space: nowrap; }
  .chip.on { background: var(--ink); color: var(--bg); }
  .chip.good { color: var(--good); }
  .chip.accent { background: var(--accent-soft); color: var(--warn); }
  .chips { display: flex; gap: 6px; flex-wrap: wrap; }
  .scroll-x { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 2px; }
  .scroll-x > * { flex: none; }
  .btn { border: 0; border-radius: 12px; padding: 12px 16px; min-height: 46px; font-weight: 700; background: var(--accent); color: var(--accent-ink); }
  .btn.dark { background: var(--ink); color: var(--bg); }
  .btn.ghost { background: transparent; color: var(--ink); border: 1px solid var(--line); }
  .btn.block { width: 100%; }
  .btn.sm { min-height: 36px; padding: 7px 12px; font-size: 14px; }
  .back { border: 0; background: none; color: var(--accent); font-weight: 700; padding: 0; justify-self: start; }
  label { display: block; font-size: 12px; font-weight: 600; color: var(--muted); margin-bottom: 4px; }
  input, select, textarea { width: 100%; font: inherit; color: var(--ink); background: var(--bg); border: 1px solid var(--line); border-radius: 11px; padding: 10px 12px; min-height: 44px; }
  textarea { min-height: 70px; resize: vertical; }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .avatar { width: 54px; height: 54px; border-radius: 16px; display: grid; place-items: center; font: 800 20px var(--display); color: #fff; flex: none; }
  .avatar.lg { width: 76px; height: 76px; border-radius: 22px; font-size: 28px; }
  .star { color: var(--accent); }
  .hero { background: var(--head); color: var(--head-ink); border-radius: var(--r); padding: 22px 18px; display: grid; gap: 12px; }
  .hero h1 { font-size: 30px; line-height: 1.05; }
  .hero p { margin: 0; color: var(--head-muted); }
  .hero .chip { background: rgba(255,255,255,.1); color: var(--head-ink); border: 0; }
  .hero .chip.on { background: var(--accent); color: var(--accent-ink); }
  .chef { display: flex; gap: 12px; align-items: flex-start; text-align: left; width: 100%; border: 1px solid var(--line); background: var(--card); border-radius: var(--r); padding: 14px; }
  .price { font: 800 18px var(--display); }
  .menu-opt { border: 1px solid var(--line); border-radius: 14px; padding: 14px; text-align: left; width: 100%; background: var(--card); display: grid; gap: 6px; }
  .menu-opt.on { border: 2px solid var(--accent); padding: 13px; }
  .courses { margin: 0; padding-left: 18px; color: var(--muted); font-size: 14px; }
  .stepper { display: flex; align-items: center; gap: 12px; }
  .stepper button { width: 40px; height: 40px; border-radius: 12px; border: 1px solid var(--line); background: var(--card); font-size: 20px; font-weight: 700; }
  .stepper b { font: 800 24px var(--display); min-width: 36px; text-align: center; }
  .tick { display: flex; gap: 10px; align-items: center; padding: 9px 0; border-bottom: 1px solid var(--line); font-size: 15px; color: var(--ink); font-weight: 500; margin: 0; }
  .tick:last-child { border-bottom: 0; }
  .tick input { width: 22px; height: 22px; min-height: 0; flex: none; accent-color: var(--accent); }
  table { width: 100%; border-collapse: collapse; }
  td { padding: 7px 0; border-bottom: 1px solid var(--line); vertical-align: top; }
  td:last-child { text-align: right; white-space: nowrap; padding-left: 10px; }
  tr.tot td { border-bottom: 0; font-weight: 800; font-size: 17px; }
  .note { background: var(--accent-soft); border-radius: 12px; padding: 11px 12px; font-size: 13px; }
  .allergy { background: color-mix(in srgb, var(--bad) 12%, transparent); color: var(--bad); border-radius: 10px; padding: 8px 10px; font-weight: 600; font-size: 14px; }
  .status { font-size: 11px; font-weight: 800; letter-spacing: .05em; text-transform: uppercase; padding: 3px 8px; border-radius: 99px; }
  .status.new { background: var(--accent-soft); color: var(--warn); }
  .status.accepted { background: color-mix(in srgb, var(--good) 15%, transparent); color: var(--good); }
  .status.declined { background: var(--chip); color: var(--muted); }
  .kpis { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .kpi { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 12px; }
  .kpi b { display: block; font: 800 19px var(--display); }
  .kpi span { font-size: 11px; color: var(--muted); font-weight: 600; }
  .bars { display: grid; gap: 8px; }
  .bar { display: grid; grid-template-columns: 110px 1fr 70px; gap: 8px; align-items: center; font-size: 13px; }
  .bar i { display: block; height: 12px; border-radius: 6px; background: var(--accent); }
  .bar i.alt { background: var(--muted); }
  .pain { display: grid; grid-template-columns: 30px 1fr; gap: 10px; padding: 10px 0; border-bottom: 1px solid var(--line); }
  .pain:last-child { border-bottom: 0; }
  .pain .ic { width: 30px; height: 30px; border-radius: 9px; background: var(--accent-soft); color: var(--warn); display: grid; place-items: center; font-weight: 800; }
  .pain p { margin: 2px 0 0; font-size: 14px; color: var(--muted); }
  .sample { font-size: 11px; font-weight: 700; color: var(--muted); border: 1px dashed var(--line); border-radius: 99px; padding: 2px 8px; }
  .done-ic { width: 64px; height: 64px; border-radius: 50%; background: var(--good); color: #fff; display: grid; place-items: center; font-size: 32px; margin: 0 auto; }
  .empty { text-align: center; color: var(--muted); padding: 24px 8px; }
  a { color: var(--accent); }
  .phase { display: grid; grid-template-columns: 72px 1fr; gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--line); }
  .phase:last-child { border-bottom: 0; }
  .phase b.when { font: 800 13px var(--display); color: var(--accent); }
  .toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(86px + env(safe-area-inset-bottom, 0px)); z-index: 30; background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 99px; font-weight: 600; font-size: 14px; }
  @media (max-width: 380px) { .kpis { grid-template-columns: 1fr 1fr; } .bar { grid-template-columns: 90px 1fr 62px; } }
  @media (prefers-reduced-motion: no-preference) { main > * { animation: in .25s ease both; } @keyframes in { from { transform: translateY(6px); } } }
</style>

<header class="top"><div class="top-in">
  <div class="mark" id="mark">C</div>
  <div class="brand" id="brand">Chef on Call</div>
  <div class="side" role="tablist" aria-label="Switch side">
    <button data-side="client">Client</button><button data-side="chef">Chef</button><button data-side="plan">Plan</button>
  </div>
</div></header>
<main id="app"></main>
<nav class="tabs" id="tabs"></nav>

<script>
/* =====================================================================
   CHEF ON CALL — prototype of a "book a chef" platform.
   Client side: find a chef, see an all-in price, book with a deposit,
   pre-order at pop-ups. Chef side: requests with every detail up front,
   payouts, menus, pre-orders. Plan side: research + business plan.
   Rebrand: change BRAND below (or Chef > Settings in the app).
   Prototype only: data stays on this device; no real payments.
   ===================================================================== */
const BRAND = { name: "Chef on Call", currency: "$", feePct: 10, depositPct: 30, rivalCommission: 20 };

const uid = () => Math.random().toString(36).slice(2, 9);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const day = n => { const d = new Date(); d.setDate(d.getDate() + n); return d.toISOString().slice(0, 10); };
const fmtDate = s => s ? new Date(s + "T00:00").toLocaleDateString(undefined, { weekday: "short", day: "numeric", month: "short" }) : "";
const daysAway = s => Math.round((new Date(s + "T00:00") - new Date(new Date().toDateString())) / 864e5);

/* ---------- sample data (clearly marked as samples in the UI) ---------- */
function seed() {
  const chefs = [
    { id: "you", you: true, name: "Your Name", area: "Your city", cuisine: "Modern Mediterranean", color: "#d9921a", rating: 4.9, count: 37, tonight: true, years: 9,
      bio: "Ex-restaurant chef cooking intimate dinners, pop-ups and market food. Seasonal produce, big flavours, zero stress for the host.",
      badges: ["Food hygiene L2", "Insured", "Allergen trained", "ID verified"],
      menus: [
        { id: "m1", name: "Signature 3-course", price: 85, min: 4, courses: ["Burrata, heritage tomato, basil oil", "Slow-braised lamb shoulder, smoked aubergine", "Olive oil cake, poached figs"] },
        { id: "m2", name: "Sharing feast", price: 65, min: 6, courses: ["Mezze table & flatbreads", "Charred chicken, herb rice, pickles", "Baklava & mint tea"] },
        { id: "m3", name: "Tasting menu (6 courses)", price: 140, min: 2, courses: ["Snacks", "Crudo", "Pasta", "Fish", "Meat", "Dessert"] } ],
      reviews: [ { who: "Sample review · Maya", stars: 5, text: "Felt like a restaurant in our living room, and the kitchen was cleaner than before." },
                 { who: "Sample review · Tom", stars: 5, text: "Handled two allergies without fuss. Booking took 3 minutes." } ] },
    { id: "c2", name: "Amara Okafor", area: "Downtown", cuisine: "West African fusion", color: "#2c7a4b", rating: 4.8, count: 52, tonight: false, years: 7,
      bio: "Jollof, suya and smoke. Family-style feasts for celebrations.", badges: ["Food hygiene L2", "Insured", "ID verified"],
      menus: [ { id: "a1", name: "Celebration feast", price: 70, min: 8, courses: ["Suya skewers", "Party jollof, plantain, slaw", "Puff-puff, salted caramel"] } ], reviews: [] },
    { id: "c3", name: "Kenji Mori", area: "Riverside", cuisine: "Japanese omakase", color: "#3b5bb5", rating: 5.0, count: 21, tonight: true, years: 12,
      bio: "Counter-style omakase at your table, 8–12 guests max.", badges: ["Food hygiene L3", "Insured", "Allergen trained", "ID verified"],
      menus: [ { id: "k1", name: "Omakase 10 pieces + 3 plates", price: 160, min: 4, courses: ["Chawanmushi", "10-piece nigiri", "Wagyu tataki", "Yuzu sorbet"] } ], reviews: [] },
    { id: "c4", name: "Lucía Reyes", area: "Old Town", cuisine: "Spanish tapas & paella", color: "#b3372f", rating: 4.7, count: 64, tonight: true, years: 6,
      bio: "Giant paella cooked live in your garden. Great for 10–40.", badges: ["Food hygiene L2", "Insured"],
      menus: [ { id: "l1", name: "Paella party", price: 48, min: 10, courses: ["Tapas: croquetas, pan con tomate, jamón", "Seafood or veggie paella (live)", "Crema catalana"] } ], reviews: [] },
  ];
  const popups = [
    { id: "p1", chefId: "you", title: "Weekend market booth", place: "Central farmers' market", date: day(5), time: "10:00–15:00", cap: 150,
      items: [ { name: "Lamb flatbread", price: 13 }, { name: "Halloumi & hot honey wrap", price: 11 }, { name: "Olive oil cake", price: 5 } ], sold: { 0: 38, 1: 21, 2: 30 } },
    { id: "p2", chefId: "c3", title: "Ramen night pop-up", place: "The Yard, Riverside", date: day(9), time: "18:00–22:00", cap: 60,
      items: [ { name: "Tonkotsu ramen", price: 17 }, { name: "Karaage", price: 8 } ], sold: { 0: 41, 1: 25 } },
  ];
  const bookings = [
    { id: uid(), chefId: "you", menuId: "m1", date: day(3), time: "19:30", guests: 8, client: "Sample · Priya S.", phone: "", allergies: "1 guest: tree nuts (severe)", diet: "2 vegetarian",
      kitchen: { oven: true, hob: "Induction", plates: true, parking: false }, notes: "Surprise birthday — arrive by 17:00 via side gate.", status: "new", created: Date.now() - 36e5 },
    { id: uid(), chefId: "you", menuId: "m2", date: day(12), time: "13:00", guests: 14, client: "Sample · Dan & Co", phone: "", allergies: "", diet: "1 gluten-free",
      kitchen: { oven: true, hob: "Gas", plates: false, parking: true }, notes: "Team lunch in the office kitchen.", status: "accepted", created: Date.now() - 864e5 * 2 },
    { id: uid(), chefId: "you", menuId: "m3", date: day(-6), time: "20:00", guests: 4, client: "Sample · Olivia R.", phone: "", allergies: "", diet: "",
      kitchen: { oven: true, hob: "Gas", plates: true, parking: true }, notes: "", status: "accepted", created: Date.now() - 864e5 * 12 },
  ];
  return { brand: { ...BRAND }, chefs, popups, bookings, preorders: [] };
}
const KEY = "chef-on-call-v1";
let S;
try { S = JSON.parse(localStorage.getItem(KEY)) || seed(); } catch (_) { S = seed(); }
S.brand = { ...BRAND, ...(S.brand || {}) };
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (_) {} };

/* ---------- money ---------- */
const money = v => S.brand.currency + Math.round(v).toLocaleString();
const chefById = id => S.chefs.find(c => c.id === id);
const menuOf = b => (chefById(b.chefId)?.menus || []).find(m => m.id === b.menuId);
function quote(menu, guests) {
  const sub = menu.price * guests;
  const fee = sub * S.brand.feePct / 100;
  const total = sub + fee;
  const deposit = total * S.brand.depositPct / 100;
  return { sub, fee, total, deposit, chefGets: sub, rivalGets: sub * (1 - S.brand.rivalCommission / 100) };
}

/* ---------- icons ---------- */
const I = {
  search: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>',
  tent: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 20 12 4l9 16H3Z"/><path d="M12 20v-6"/></svg>',
  cal: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>',
  inbox: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 13h5l2 3h4l2-3h5"/><path d="M5 5h14l2 8v6H3v-6l2-8Z"/></svg>',
  coin: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M15 9.5c-.5-1-1.6-1.5-3-1.5-1.7 0-3 .8-3 2s1.3 1.7 3 2 3 .8 3 2-1.3 2-3 2c-1.4 0-2.5-.5-3-1.5M12 6v2M12 16v2"/></svg>',
  book: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 5a2 2 0 0 1 2-2h13v16H6a2 2 0 0 0-2 2V5Z"/><path d="M4 19a2 2 0 0 0 2 2h13"/></svg>',
  user: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"/></svg>',
  bulb: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 18h6M10 21h4M12 3a6 6 0 0 0-4 10.5c.7.7 1 1.5 1 2.5h6c0-1 .3-1.8 1-2.5A6 6 0 0 0 12 3Z"/></svg>',
  chart: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>',
  road: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 21 9 3M19 21 15 3M12 5v2M12 11v2M12 17v2"/></svg>',
};
const TABS = {
  client: [["find", "Find a chef", I.search], ["popups", "Pop-ups", I.tent], ["mine", "My bookings", I.cal]],
  chef: [["requests", "Requests", I.inbox], ["earnings", "Earnings", I.coin], ["menus", "Menus", I.book], ["profile", "Profile", I.user]],
  plan: [["why", "The problem", I.bulb], ["model", "Business", I.chart], ["roadmap", "Roadmap", I.road]],
};

/* ---------- navigation ---------- */
let V = { side: "client", tab: "find", stack: [] }; // stack holds detail screens
const app = document.getElementById("app");
function go(screen) { V.stack.push(screen); render(); }
function back() { V.stack.pop(); render(); }
function toast(t) { const d = document.createElement("div"); d.className = "toast"; d.textContent = t; document.body.appendChild(d); setTimeout(() => d.remove(), 1800); }
function armed(btn, label, fn) { btn.onclick = () => { if (btn.dataset.a) return fn(); const o = btn.textContent; btn.dataset.a = 1; btn.textContent = label; setTimeout(() => { delete btn.dataset.a; btn.textContent = o; }, 3000); }; }

function render() {
  const b = S.brand;
  document.getElementById("brand").textContent = b.name;
  document.getElementById("mark").textContent = (b.name || "C")[0].toUpperCase();
  document.title = b.name;
  document.querySelectorAll("[data-side]").forEach(x => x.classList.toggle("on", x.dataset.side === V.side));
  const newCount = S.bookings.filter(x => x.chefId === "you" && x.status === "new").length;
  document.getElementById("tabs").innerHTML = TABS[V.side].map(([k, l, ic]) =>
    `<button data-tab="${k}" class="${k === V.tab ? "on" : ""}">${ic}<span>${l}${k === "requests" && newCount ? `<span class="badge-dot">${newCount}</span>` : ""}</span></button>`).join("");
  document.querySelectorAll("[data-tab]").forEach(x => x.onclick = () => { V.tab = x.dataset.tab; V.stack = []; render(); });
  const top = V.stack[V.stack.length - 1];
  if (top) SCREENS[top.s](top);
  else SCREENS[V.tab]();
  window.scrollTo(0, 0);
}

      <div class="sm">That's <b>${money(tot.me - tot.rival)}</b> more for you. The client pays a ${S.brand.feePct}% service fee and your price stays whole.</div></div>
    ${pops.map(p => { const sold = p.items.map((it, i) => p.sold[i] || 0), rev = p.items.reduce((a, it, i) => a + it.price * (p.sold[i] || 0), 0); return `<div class="card stack">
      <div class="row"><h3 class="grow">${esc(p.title)}</h3><span class="xs muted">${fmtDate(p.date)}</span></div>

      <table class="num">${p.items.map((it, i) => `<tr><td>${esc(it.name)}</td><td>${sold[i]} pre-ordered → prep <b>${Math.ceil(sold[i] * 1.6)}</b></td></tr>`).join("")}

};

  app.querySelector("#tn").onchange = e => { c.tonight = e.target.checked; save(); };
  app.querySelector("#bn").oninput = e => { b.name = e.target.value || "Chef on Call"; save(); document.getElementById("brand").textContent = b.name; };
  app.querySelector("#bc").oninput = e => { b.currency = e.target.value || "$"; save(); };
  app.querySelector("#view").onclick = () => { V.side = "client"; V.tab = "find"; V.stack = [{ s: "chef", id: "you" }]; render(); };
  app.querySelector("#cp").onclick = () => { const v = app.querySelector("#link").value; try { navigator.clipboard.writeText(v).then(() => toast("Copied"), () => app.querySelector("#link").select()); } catch (_) { app.querySelector("#link").select(); } };
  armed(app.querySelector("#reset"), "Tap again to reset", () => { S = seed(); save(); toast("Demo reset"); render(); });
};
