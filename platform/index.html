<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"></head><body>
<title>Chef on Call</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
<style>
  /* Layout: iOS-style app. Translucent nav bar + large titles, inset grouped lists, bottom sheets, translucent tab bar.
     Guest side: warm, photo-led discovery like a hotel app. Chef side: three practical tabs (Bookings, Tools, Extras). */
  :root {
    --bg: #f8f3ec; --card: #ffffff; --fill: #f1ebe3; --ink: #1f1a16; --sec: #7b6f64; --sep: #e8dfd4;
    --accent: #e0742c; --accent-ink: #ffffff; --accent-soft: #fbe9db;
    --good: #2f8a55; --bad: #d1443a; --warn: #b8690f;
    --bar: rgba(248, 243, 236, .82); --shadow: 0 1px 2px rgba(60, 40, 20, .06), 0 8px 24px rgba(60, 40, 20, .07);
    --overlay: rgba(25, 18, 12, .42);
    --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Inter", system-ui, sans-serif;
    --display: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Inter", system-ui, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #15110e; --card: #221c17; --fill: #2c251f; --ink: #f6efe7; --sec: #ab9d90; --sep: #3a3129;
      --accent: #f0883f; --accent-soft: #3b2616; --bar: rgba(21, 17, 14, .8); --shadow: none; --overlay: rgba(0,0,0,.55); color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #15110e; --card: #221c17; --fill: #2c251f; --ink: #f6efe7; --sec: #ab9d90; --sep: #3a3129;
    --accent: #f0883f; --accent-soft: #3b2616; --bar: rgba(21, 17, 14, .8); --shadow: none; --overlay: rgba(0,0,0,.55); color-scheme: dark;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 17px/1.4 var(--font); letter-spacing: -.01em;
    padding-bottom: calc(84px + env(safe-area-inset-bottom, 0px)); -webkit-font-smoothing: antialiased; }
  body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bar); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); }
  button { font: inherit; color: inherit; cursor: pointer; border: 0; background: none; padding: 0; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 8px; }
  img { max-width: 100%; display: block; }

  .nav { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 8; background: var(--bar); backdrop-filter: saturate(180%) blur(20px); -webkit-backdrop-filter: saturate(180%) blur(20px);
    border-bottom: .5px solid var(--sep); padding-block: 8px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
  .nav-in { max-width: 760px; margin: 0 auto; display: flex; align-items: center; gap: 8px; min-height: 36px; }
  .back { color: var(--accent); font-size: 17px; display: flex; align-items: center; gap: 2px; min-height: 44px; }
  .back svg { width: 22px; height: 22px; }
  .seg { display: inline-flex; background: var(--fill); border-radius: 9px; padding: 2px; margin-left: auto; }
  .seg button { font-size: 13px; font-weight: 600; padding: 6px 14px; border-radius: 7px; color: var(--sec); min-height: 32px; }
  .seg button.on { background: var(--card); color: var(--ink); box-shadow: 0 1px 3px rgba(0,0,0,.12); }
  .seg.full { display: flex; margin: 0; }
  .seg.full button { flex: 1; }

  main { max-width: 760px; margin: 0 auto; padding-block: 6px 20px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: grid; gap: 22px; }
  main > * { min-width: 0; }
  .large { font: 700 34px/1.12 var(--display); letter-spacing: .005em; margin: 6px 0 0; text-wrap: balance; }
  .subtitle { color: var(--sec); font-size: 15px; margin-top: 2px; }
  h2.sec { font: 700 22px/1.2 var(--display); margin: 0; letter-spacing: -.01em; }
  .sec-head { display: flex; align-items: baseline; gap: 8px; margin-bottom: 10px; }
  .sec-head > :last-child:not(:first-child) { margin-left: auto; }
  .muted { color: var(--sec); }
  .fn { font-size: 13px; }
  .cap { font-size: 12px; }
  .num { font-variant-numeric: tabular-nums; }
  .stack { display: grid; gap: 12px; }
  .row { display: flex; align-items: center; gap: 10px; }
  .grow { flex: 1; min-width: 0; }
  .hscroll { display: flex; gap: 12px; overflow-x: auto; scroll-snap-type: x mandatory; scrollbar-width: none; margin-inline: -16px; padding-inline: 16px; scroll-padding-inline: 16px; padding-bottom: 4px; }
  .hscroll::-webkit-scrollbar { display: none; }
  .hscroll > * { flex: none; scroll-snap-align: start; }

  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; background: var(--accent); color: var(--accent-ink); font-weight: 600; font-size: 17px; border-radius: 14px; min-height: 50px; padding: 0 20px; }
  .btn.block { width: 100%; }
  .btn.sm { min-height: 34px; font-size: 15px; border-radius: 99px; padding: 0 14px; }
  .btn.tint { background: var(--accent-soft); color: var(--accent); }
  .btn.plain { background: var(--fill); color: var(--ink); }
  .btn.dest { background: var(--fill); color: var(--bad); }
  .btn[disabled] { opacity: .45; }

  .list { background: var(--card); border-radius: 12px; overflow: hidden; }
  .list-h { font-size: 13px; color: var(--sec); text-transform: uppercase; letter-spacing: .02em; margin: 0 16px 7px; }
  .list-f { font-size: 13px; color: var(--sec); margin: 7px 16px 0; }
  .cell { display: flex; align-items: center; gap: 12px; padding: 11px 16px; min-height: 44px; width: 100%; text-align: left; position: relative; }
  .cell + .cell::before { content: ""; position: absolute; top: 0; right: 0; left: 16px; border-top: .5px solid var(--sep); }
  .cell.ic + .cell.ic::before { left: 58px; }
  .cell .chev { color: var(--sec); opacity: .5; width: 14px; height: 14px; flex: none; display: grid; }
  .cell .val { color: var(--sec); font-size: 15px; }
  .icon-sq { width: 30px; height: 30px; border-radius: 8px; display: grid; place-items: center; color: #fff; flex: none; }
  .icon-sq svg { width: 18px; height: 18px; }
  .cell input, .cell select { border: 0; background: none; font: inherit; color: var(--ink); text-align: right; min-width: 0; flex: 1; padding: 0; min-height: 30px; }
  .cell input:focus { outline: none; }
  .field { display: grid; gap: 4px; }
  .field label { font-size: 13px; color: var(--sec); }
  .field input, .field textarea, .field select { width: 100%; font: inherit; color: var(--ink); background: var(--fill); border: 0; border-radius: 10px; padding: 11px 12px; min-height: 44px; }
  .field textarea { min-height: 84px; resize: vertical; }

  .switch { position: relative; width: 51px; height: 31px; flex: none; }
  .switch input { opacity: 0; position: absolute; inset: 0; margin: 0; cursor: pointer; z-index: 1; }
  .switch span { position: absolute; inset: 0; background: var(--sep); border-radius: 99px; transition: background .2s; }
  .switch span::after { content: ""; position: absolute; top: 2px; left: 2px; width: 27px; height: 27px; border-radius: 50%; background: #fff; box-shadow: 0 2px 4px rgba(0,0,0,.2); transition: transform .2s; }
  .switch input:checked + span { background: #34c759; }
  .switch input:checked + span::after { transform: translateX(20px); }

  .slider { position: relative; border-radius: 18px; overflow: hidden; background: var(--fill); }
  .slides { display: flex; overflow-x: auto; scroll-snap-type: x mandatory; scrollbar-width: none; height: 100%; }
  .slides::-webkit-scrollbar { display: none; }
  .slide { flex: 0 0 100%; scroll-snap-align: center; position: relative; height: 100%; }
  .slide > svg, .slide > img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .dots { position: absolute; bottom: 10px; left: 0; right: 0; display: flex; justify-content: center; gap: 6px; pointer-events: none; }
  .dots i { width: 6px; height: 6px; border-radius: 50%; background: rgba(255,255,255,.55); transition: background .2s, transform .2s; }
  .dots i.on { background: #fff; transform: scale(1.2); }
  .hero { height: 360px; }
  .shade { position: absolute; inset: 0; background: linear-gradient(180deg, rgba(0,0,0,0) 35%, rgba(20,10,4,.75) 100%); }
  .copy { position: absolute; left: 18px; right: 18px; bottom: 32px; color: #fff; display: grid; gap: 6px; }
  .copy b { font: 700 28px/1.1 var(--display); text-wrap: balance; }
  .copy span { font-size: 15px; opacity: .92; }
  .copy .btn { justify-self: start; margin-top: 6px; background: #fff; color: #1f1a16; }
  .heart { position: absolute; top: 10px; right: 10px; width: 36px; height: 36px; border-radius: 50%; background: rgba(0,0,0,.28); backdrop-filter: blur(8px); color: #fff; display: grid; place-items: center; z-index: 2; }
  .heart svg { width: 20px; height: 20px; }
  .heart.on { color: #ff5a5f; background: rgba(255,255,255,.92); }
  .tag { position: absolute; top: 12px; left: 12px; z-index: 2; background: rgba(255,255,255,.94); color: #1f1a16; font-size: 12px; font-weight: 700; padding: 5px 10px; border-radius: 99px; }
  .tag.deal { background: #d1443a; color: #fff; }

  .search { display: flex; align-items: center; gap: 12px; width: 100%; background: var(--card); border-radius: 99px; padding: 8px 8px 8px 18px; box-shadow: var(--shadow); text-align: left; border: .5px solid var(--sep); }
  .search b { display: block; font-size: 15px; }
  .search span.s { font-size: 13px; color: var(--sec); }
  .search .go { margin-left: auto; width: 42px; height: 42px; border-radius: 50%; background: var(--accent); color: #fff; display: grid; place-items: center; flex: none; }
  .search .go svg { width: 20px; height: 20px; }

  .cat { display: grid; justify-items: center; gap: 6px; width: 78px; font-size: 12px; font-weight: 600; color: var(--sec); text-align: center; }
  .cat .bub { width: 60px; height: 60px; border-radius: 18px; background: var(--card); display: grid; place-items: center; color: var(--accent); box-shadow: var(--shadow); border: .5px solid var(--sep); }
  .cat .bub svg { width: 28px; height: 28px; }
  .cat.on { color: var(--ink); }
  .cat.on .bub { background: var(--accent); color: #fff; border-color: transparent; }

  .chef-card { display: grid; gap: 10px; text-align: left; width: 100%; cursor: pointer; }
  .chef-card .slider { height: 240px; }
  .meta { display: grid; gap: 2px; }
  .meta .top { display: flex; gap: 8px; align-items: baseline; }
  .meta .top b { font-size: 17px; flex: 1; min-width: 0; }
  .star { font-size: 15px; white-space: nowrap; }
  .star svg { width: 13px; height: 13px; vertical-align: -1px; }
  .mini { width: 250px; display: grid; gap: 8px; text-align: left; cursor: pointer; }
  .mini .slider { height: 170px; }
  .pills { display: flex; flex-wrap: wrap; gap: 6px; }
  .pill { font-size: 12px; font-weight: 600; padding: 4px 10px; border-radius: 99px; background: var(--fill); color: var(--sec); }
  .pill.good { color: var(--good); }

  .promo { border-radius: 18px; padding: 16px; color: #fff; display: grid; gap: 4px; text-align: left; min-height: 150px; align-content: end; position: relative; overflow: hidden; width: 100%; }
  .promo b { font: 700 19px/1.15 var(--display); }
  .promo span { font-size: 13px; opacity: .92; }
  .promo .big-ic { position: absolute; top: 14px; right: 14px; width: 34px; height: 34px; opacity: .9; }
  .promo-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .banner { display: flex; gap: 14px; align-items: center; background: var(--accent-soft); border-radius: 18px; padding: 14px 16px; text-align: left; width: 100%; }
  .code { font: 700 13px ui-monospace, "SF Mono", Menlo, monospace; background: var(--card); color: var(--accent); padding: 4px 8px; border-radius: 6px; border: 1px dashed var(--accent); white-space: nowrap; }
  .review { width: 280px; background: var(--card); border-radius: 18px; padding: 16px; display: grid; gap: 8px; box-shadow: var(--shadow); align-content: start; }
  .review .who { display: flex; gap: 10px; align-items: center; }
  .av { width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; color: #fff; font-weight: 700; font-size: 14px; flex: none; }
  .stars { color: #f4a62a; letter-spacing: 1px; font-size: 14px; }
  .trust { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .trust div { background: var(--card); border-radius: 14px; padding: 14px; display: grid; gap: 4px; align-content: start; }
  .trust svg { width: 24px; height: 24px; color: var(--good); }
  .trust b { font-size: 15px; }

  .tabbar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 8; background: var(--bar); backdrop-filter: saturate(180%) blur(20px); -webkit-backdrop-filter: saturate(180%) blur(20px);
    border-top: .5px solid var(--sep); display: flex; justify-content: center; padding-bottom: env(safe-area-inset-bottom, 0px);
    padding-left: max(8px, env(safe-area-inset-left, 0px)); padding-right: max(8px, env(safe-area-inset-right, 0px)); }
  .tabbar button { flex: 1; max-width: 160px; display: grid; justify-items: center; gap: 2px; padding: 7px 0 6px; font-size: 10px; font-weight: 600; color: var(--sec); min-height: 49px; position: relative; }
  .tabbar svg { width: 25px; height: 25px; }
  .tabbar button.on { color: var(--accent); }
  .tabbar .badge { position: absolute; top: 3px; left: calc(50% + 6px); background: var(--bad); color: #fff; font-size: 11px; min-width: 18px; height: 18px; border-radius: 9px; display: grid; place-items: center; padding: 0 5px; }

  .sheet-wrap { position: fixed; inset: 0; z-index: 30; background: var(--overlay); display: flex; align-items: flex-end; justify-content: center; }
  .sheet { background: var(--bg); width: 100%; max-width: 640px; max-height: calc(100% - 40px - env(safe-area-inset-top, 0px)); overflow-y: auto; border-radius: 14px 14px 0 0;
    padding: 8px max(16px, env(safe-area-inset-right, 0px)) calc(20px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); display: grid; gap: 16px; align-content: start; }
  .grabber { width: 36px; height: 5px; border-radius: 3px; background: var(--sep); margin: 0 auto; }
  .sheet-head { display: flex; align-items: center; gap: 8px; }
  .sheet-head h3 { font: 700 20px var(--display); margin: 0; flex: 1; }
  .close { width: 30px; height: 30px; border-radius: 50%; background: var(--fill); color: var(--sec); display: grid; place-items: center; }
  .close svg { width: 14px; height: 14px; }
  @media (prefers-reduced-motion: no-preference) { .sheet { animation: up .32s cubic-bezier(.2,.9,.3,1); } @keyframes up { from { transform: translateY(40%); opacity: .4; } } }
  .stepper { display: inline-flex; align-items: center; background: var(--fill); border-radius: 9px; }
  .stepper button { width: 44px; height: 34px; font-size: 20px; color: var(--ink); }
  .stepper b { min-width: 34px; text-align: center; font-size: 17px; }
  table { width: 100%; border-collapse: collapse; }
  .sum td { padding: 6px 0; font-size: 15px; vertical-align: top; }
  .sum td:last-child { text-align: right; padding-left: 10px; white-space: nowrap; }
  .sum tr.tot td { font-weight: 700; font-size: 17px; padding-top: 10px; border-top: .5px solid var(--sep); }
  .allergy { background: color-mix(in srgb, var(--bad) 13%, transparent); color: var(--bad); border-radius: 10px; padding: 9px 12px; font-weight: 600; font-size: 15px; }
  .note { background: var(--accent-soft); border-radius: 12px; padding: 12px 14px; font-size: 14px; }
  .done { text-align: center; display: grid; gap: 10px; justify-items: center; padding: 20px 0; }
  .ok { width: 72px; height: 72px; border-radius: 50%; background: var(--good); color: #fff; display: grid; place-items: center; }
  .ok svg { width: 36px; height: 36px; }

  .week { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; background: var(--card); border-radius: 14px; padding: 8px 6px; }
  .week button { display: grid; justify-items: center; gap: 2px; padding: 6px 0; border-radius: 10px; font-size: 12px; color: var(--sec); }
  .week button b { font-size: 17px; color: var(--ink); }
  .week button.on { background: var(--accent); color: #fff; }
  .week button.on b { color: #fff; }
  .week i { width: 5px; height: 5px; border-radius: 50%; background: var(--accent); }
  .week button.on i { background: #fff; }
  .week i.none { background: transparent; }
  .bk { background: var(--card); border-radius: 14px; padding: 14px 16px; display: grid; gap: 6px; text-align: left; width: 100%; }
  .bk .top { display: flex; align-items: center; gap: 10px; }
  .status { font-size: 12px; font-weight: 700; padding: 3px 9px; border-radius: 99px; white-space: nowrap; }
  .status.new { background: var(--accent-soft); color: var(--accent); }
  .status.accepted { background: color-mix(in srgb, var(--good) 14%, transparent); color: var(--good); }
  .status.declined { background: var(--fill); color: var(--sec); }
  .stat-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
  .stat { background: var(--card); border-radius: 14px; padding: 12px 14px; }
  .stat b { display: block; font: 700 20px var(--display); }
  .stat span { font-size: 12px; color: var(--sec); }
  .tools { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .tool { background: var(--card); border-radius: 18px; padding: 16px; display: grid; gap: 8px; text-align: left; align-content: start; min-height: 136px; }
  .tool .icon-sq { width: 40px; height: 40px; border-radius: 11px; }
  .tool .icon-sq svg { width: 22px; height: 22px; }
  .tool b { font-size: 16px; }
  .tool > span:not(.icon-sq) { font-size: 13px; color: var(--sec); }
  .result { background: var(--card); border-radius: 14px; padding: 16px; display: grid; gap: 4px; text-align: center; }
  .result b { font: 700 34px var(--display); color: var(--accent); }
  .bars { display: grid; gap: 10px; }
  .bar { display: grid; grid-template-columns: 96px 1fr 72px; gap: 10px; align-items: center; font-size: 14px; }
  .bar i { display: block; height: 10px; border-radius: 5px; background: var(--accent); }
  .bar i.alt { background: var(--sec); opacity: .45; }
  .bar b { text-align: right; }
  .tl { display: grid; grid-template-columns: 70px 18px 1fr; gap: 8px; align-items: start; min-height: 46px; }
  .tl .t { font-weight: 700; font-size: 15px; text-align: right; }
  .tl .dot { width: 12px; height: 12px; border-radius: 50%; background: var(--accent); margin-top: 5px; position: relative; justify-self: center; }
  .tl:not(:last-child) .dot::after { content: ""; position: absolute; left: 5px; top: 12px; width: 2px; height: 38px; background: var(--sep); }
  .photos { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .ph { aspect-ratio: 1; border-radius: 12px; overflow: hidden; position: relative; background: var(--fill); max-width: 100%; }
  .ph img { width: 100%; height: 100%; object-fit: cover; }
  .ph button { position: absolute; top: 6px; right: 6px; min-width: 28px; height: 28px; border-radius: 14px; background: rgba(0,0,0,.6); color: #fff; font-size: 13px; padding: 0 8px; }
  .ph.add { display: grid; place-items: center; color: var(--accent); font-size: 34px; border: 2px dashed var(--sep); background: none; cursor: pointer; }
  .matrix { overflow-x: auto; }
  .matrix table { font-size: 13px; min-width: 560px; }
  .matrix th, .matrix td { padding: 6px 4px; text-align: center; border-bottom: .5px solid var(--sep); }
  .matrix th:first-child, .matrix td:first-child { text-align: left; padding-left: 12px; }
  .toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(96px + env(safe-area-inset-bottom, 0px)); z-index: 40; background: rgba(30,24,20,.92); color: #fff; padding: 11px 18px; border-radius: 99px; font-size: 15px; font-weight: 600; white-space: nowrap; max-width: calc(100% - 32px); overflow: hidden; text-overflow: ellipsis; }
  a { color: var(--accent); }
  @media (max-width: 370px) { .promo-grid, .tools, .trust { grid-template-columns: 1fr; } .stat-row { grid-template-columns: 1fr 1fr; } }
</style>

<script>
/* =====================================================================
   CHEF ON CALL — prototype of a "book a private chef" app.
   Rebrand: change BRAND (or Chef > Extras > Brand & settings in the app).
   Prototype: data stays on this device, payments are pretend.
   ===================================================================== */
const BRAND = { name: "Chef on Call", currency: "$", feePct: 10, depositPct: 30, rivalCommission: 20, welcome: 40 };

const uid = () => Math.random().toString(36).slice(2, 9);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const day = n => { const d = new Date(); d.setDate(d.getDate() + n); return d.toISOString().slice(0, 10); };
const fmtDate = s => s ? new Date(s + "T00:00").toLocaleDateString(undefined, { weekday: "short", day: "numeric", month: "short" }) : "";
const daysAway = s => Math.round((new Date(s + "T00:00") - new Date(new Date().toDateString())) / 864e5);
const hr = new Date().getHours();
const greet = hr < 12 ? "Good morning" : hr < 18 ? "Good afternoon" : "Good evening";

/* ---------- SF-style icons ---------- */

function copy(text, ok = "Copied") { try { navigator.clipboard.writeText(text).then(() => toast(ok), () => toast("Copy blocked here. Select the text instead")); } catch (_) { toast("Copy blocked here. Select the text instead"); } }

function wireSliders(root = app) {

    const track = sl.querySelector(".slides"), dots = sl.querySelectorAll(".dots i");
    if (track) track.addEventListener("scroll", () => { const i = Math.round(track.scrollLeft / track.clientWidth); dots.forEach((d, j) => d.classList.toggle("on", i === j)); }, { passive: true });
  });
  clearInterval(heroTimer);
  const hero = root.querySelector(".hero .slides");

function openSheet(title, html, mount) {

  const onKey = e => { if (e.key === "Escape") close(); };
  const close = () => { w.remove(); document.removeEventListener("keydown", onKey); };
  w.addEventListener("click", e => { if (e.target === w) close(); });
  w.querySelector(".close").onclick = close;
  document.addEventListener("keydown", onKey);
  document.body.appendChild(w);
  const api = { body: w.querySelector("#sb"), close, root: w, title: t => w.querySelector("h3").textContent = t };

  wireSliders(w);

}

function bookSheet(c, m) {
  const d = { guests: Math.max(m.min, Math.min(filter.guests, 40)), date: filter.date || day(7), time: "19:30", allergies: "", diet: "", kitchen: { oven: true, hob: "Gas", plates: true, parking: false }, notes: "", client: "", code: "" };
  let step = 1;
  const codeValue = sub => {
    const code = d.code.trim().toUpperCase();
    if (code && code === "WELCOME" + S.brand.welcome && S.promos.welcome && !S.usedWelcome) return [S.brand.welcome, "Welcome offer"];
    if (code === "FRIEND25") return [25, "Friend referral"];
    if (c.you && code && code === (S.promos.code || "").toUpperCase()) return [sub * .1, "Chef's promo code"];
    const g = code && S.gifts.find(x => x.code === code); if (g) return [Math.min(g.amt, sub), "Gift card"];
    if (c.you && S.promos.lastMinute && daysAway(d.date) <= 0) return [sub * .15, "Tonight deal"];
    if (c.you && S.promos.group && d.guests >= 12) return [sub * .1, "Group 12+"];
    return [0, ""];
  };
  openSheet("Book " + c.name.split(" ")[0], "", function draw(api) {
    const sub = m.price * d.guests, [disc, why] = codeValue(sub), q = quote(m, d.guests, disc);
    let h = `<div class="seg full" aria-hidden="true">${["Dinner", "Kitchen", "Confirm"].map((t, i) => `<button class="${step === i + 1 ? "on" : ""}" tabindex="-1">${i + 1}. ${t}</button>`).join("")}</div>`;
    if (step === 1) h += `
      <div class="row">${slider([c.you && PHOTOS[0] ? { img: PHOTOS[0] } : { scene: c.scenes[1] || "plate", hue: c.hue }], "", "", "width:84px;height:84px;border-radius:14px;flex:none")}<div class="grow"><b>${esc(m.name)}</b><div class="fn muted">${esc(c.name)} · ${money(m.price)} per guest</div></div></div>
      <div><div class="list"><div class="cell"><span class="grow">Guests</span><span class="stepper"><button id="gm" aria-label="Fewer guests">−</button><b class="num">${d.guests}</b><button id="gp" aria-label="More guests">+</button></span></div>
        <div class="cell"><span class="grow">Date</span><input type="date" id="dd" value="${d.date}" min="${day(0)}" aria-label="Date"></div>
        <div class="cell"><span class="grow">Dinner time</span><input type="time" id="dt" value="${d.time}" aria-label="Dinner time"></div></div>
      <div class="list-f">Minimum ${m.min} guests for this menu.</div></div>
      <div class="list" style="padding:12px 16px"><table class="sum num"><tr><td>${d.guests} × ${money(m.price)}</td><td>${money(q.sub)}</td></tr><tr><td>Service fee</td><td>${money(q.fee)}</td></tr>${disc ? `<tr><td style="color:var(--good)">${why}</td><td style="color:var(--good)">−${money(disc)}</td></tr>` : ""}<tr class="tot"><td>Total</td><td>${money(q.total)}</td></tr></table></div>`;
    if (step === 2) h += `
      <div><div class="list-h">Allergies & diets</div><div class="list" style="padding:12px;display:grid;gap:10px">
        <div class="field"><label for="al">Allergies (the chef sees these in red)</label><input id="al" value="${esc(d.allergies)}" placeholder="e.g. 1 guest: peanuts (severe)"></div>
        <div class="field"><label for="di">Diets</label><input id="di" value="${esc(d.diet)}" placeholder="e.g. 2 vegetarian, 1 halal"></div></div></div>
      <div><div class="list-h">Your kitchen</div><div class="list">
        ${[["oven", "Working oven"], ["plates", "Plates & cutlery for everyone"], ["parking", "Parking near the door"]].map(([k, l]) => `<div class="cell"><span class="grow">${l}</span><label class="switch"><input type="checkbox" data-kc="${k}" ${d.kitchen[k] ? "checked" : ""} aria-label="${l}"><span></span></label></div>`).join("")}
        <div class="cell"><span class="grow">Hob</span><select id="hob" aria-label="Hob type">${["Gas", "Induction", "Electric", "None"].map(x => `<option ${x === d.kitchen.hob ? "selected" : ""}>${x}</option>`).join("")}</select></div></div>
        <div class="list-f">Missing something? The chef brings it.</div></div>
      <div class="field"><label for="nt">Occasion, access, timing</label><textarea id="nt" placeholder="e.g. Surprise party, use the side gate">${esc(d.notes)}</textarea></div>`;
    if (step === 3) h += `
      ${d.allergies ? `<div class="allergy">⚠ ${esc(d.allergies)}</div>` : ""}
      <div class="list" style="padding:14px 16px"><table class="sum num">
        <tr><td>${esc(m.name)}<div class="cap muted">${d.guests} guests · ${fmtDate(d.date)} ${esc(d.time)}</div></td><td>${money(q.sub)}</td></tr>
        <tr><td>Service fee</td><td>${money(q.fee)}</td></tr>
        ${disc ? `<tr><td style="color:var(--good)">${why}</td><td style="color:var(--good)">−${money(disc)}</td></tr>` : ""}
        <tr class="tot"><td>Total</td><td>${money(q.total)}</td></tr>
        <tr><td><b>Due today (${S.brand.depositPct}% deposit)</b></td><td><b>${money(q.deposit)}</b></td></tr></table></div>
      <div class="list"><div class="cell"><span class="grow">Promo or gift code</span><input id="pc" value="${esc(d.code)}" placeholder="Add code" autocapitalize="characters" aria-label="Promo or gift code"></div></div>
      <div class="field"><label for="nm">Your name</label><input id="nm" value="${esc(d.client)}" autocomplete="name"></div>
      <div class="note"><b>Free cancellation</b> up to 14 days before. 7–14 days: deposit kept. Under 7 days: 50%, because groceries are bought.</div>`;
    h += `<div class="row">${step > 1 ? `<button class="btn plain" id="prev">Back</button>` : ""}<button class="btn grow" id="next">${step < 3 ? "Continue" : "Pay " + money(q.deposit) + " deposit"}</button></div>`;
    api.body.innerHTML = h; wireSliders(api.body);
    const $ = s => api.body.querySelector(s);
    if (step === 1) {
      $("#gm").onclick = () => { d.guests = Math.max(m.min, d.guests - 1); draw(api); };
      $("#gp").onclick = () => { d.guests = Math.min(80, d.guests + 1); draw(api); };
      $("#dd").onchange = e => { d.date = e.target.value || d.date; draw(api); }; $("#dt").onchange = e => d.time = e.target.value;
    }
    if (step === 2) {
      $("#al").oninput = e => d.allergies = e.target.value; $("#di").oninput = e => d.diet = e.target.value; $("#nt").oninput = e => d.notes = e.target.value;
      $("#hob").onchange = e => d.kitchen.hob = e.target.value; api.body.querySelectorAll("[data-kc]").forEach(x => x.onchange = () => d.kitchen[x.dataset.kc] = x.checked);
    }
    if (step === 3) { $("#pc").onchange = e => { d.code = e.target.value; draw(api); if (codeValue(sub)[0]) toast("Code applied"); }; $("#nm").oninput = e => d.client = e.target.value; }
    if ($("#prev")) $("#prev").onclick = () => { step--; draw(api); };
    $("#next").onclick = () => {
      if (step < 3) { step++; return draw(api); }
      if (!d.client.trim()) { $("#nm").focus(); $("#nm").style.boxShadow = "0 0 0 2px var(--bad)"; toast("Add your name to continue"); return; }
      if (why === "Welcome offer") S.usedWelcome = true;
      S.bookings.push({ id: uid(), chefId: c.id, menuId: m.id, ...JSON.parse(JSON.stringify(d)), discount: disc, status: "new", created: Date.now(), mine: true }); save();
      api.title("Request sent");
      api.body.innerHTML = `<div class="done"><span class="ok">${I.check}</span><b style="font-size:22px">${esc(c.name.split(" ")[0])} has your request</b><span class="muted">Chefs reply within 2 hours. If they can't make it, your deposit comes back automatically.</span></div>
        ${c.you ? `<div class="note">Demo: switch to <b>Chef</b> at the top to see this request arrive.</div>` : ""}<button class="btn block" id="seeb">See my dinners</button>`;
      $("#seeb").onclick = () => { api.close(); V.tab = "dinners"; V.stack = []; render(); };
    };
  });
}

function toolSheet(kind, opts = {}) {
  const t = TOOLS.find(x => x[0] === kind);
  const num = (id, label, val, suf = "") => `<div class="cell"><label class="grow" for="${id}">${label}</label><input type="number" inputmode="decimal" id="${id}" value="${val}" style="max-width:96px"><span class="val" style="min-width:16px">${suf}</span></div>`;

      <div class="row"><div class="field grow"><label for="pa">Area</label><input id="pa" data-p="area" value="${esc(c.area)}"></div><div class="field grow"><label for="pc">Cuisine</label><input id="pc" data-p="cuisine" value="${esc(c.cuisine)}"></div></div>
      <div class="field"><label for="pb">Bio</label><textarea id="pb" data-p="bio">${esc(c.bio)}</textarea></div></div>
    <div class="list"><div class="cell"><span class="grow">Free tonight<div class="cap muted">Shows you under "Free tonight" on Discover</div></span><label class="switch"><input type="checkbox" id="tn" ${c.tonight ? "checked" : ""} aria-label="Free tonight"><span></span></label></div></div>
    <div><div class="list-h">Direct booking link · 0% fees</div><div class="list"><div class="cell"><span class="grow fn" style="word-break:break-all">${esc(link)}</span><button class="btn sm tint" id="cp">Copy</button></div></div><div class="list-f">Put it in your Instagram bio. Guests you bring yourself pay no service fee.</div></div>
    <button class="btn block plain" id="pv">Preview as a guest</button>`;
  app.querySelectorAll("[data-p]").forEach(el => el.oninput = () => { c[el.dataset.p] = el.value; save(); });
  app.querySelector("#tn").onchange = e => { c.tonight = e.target.checked; save(); };
  app.querySelector("#cp").onclick = () => copy(link, "Link copied");
  app.querySelector("#pv").onclick = () => { V.role = "guest"; V.tab = "discover"; V.stack = [{ p: "chef", id: "you", title: "Discover" }]; render(); };
};
PAGES.brand = () => {
  const b = S.brand;
  app.innerHTML = `<h1 class="large">Brand & settings</h1>
    <div><div class="list-h">Brand</div><div class="list"><div class="cell"><label class="grow" for="bn">Name</label><input id="bn" value="${esc(b.name)}"></div><div class="cell"><label class="grow" for="bc">Currency</label><input id="bc" value="${esc(b.currency)}" style="max-width:60px"></div></div><div class="list-f">Rename the whole platform when your brand is ready.</div></div>
    <div><div class="list-h">Platform rules</div><div class="list"><div class="cell"><label class="grow" for="bf">Guest service fee</label><input type="number" id="bf" value="${b.feePct}" style="max-width:60px"><span class="val">%</span></div><div class="cell"><label class="grow" for="bd">Deposit</label><input type="number" id="bd" value="${b.depositPct}" style="max-width:60px"><span class="val">%</span></div></div></div>
    <div class="list"><button class="cell" id="reset" style="color:var(--bad)">Reset demo data</button></div>`;
  const bind = (id, f) => app.querySelector(id).oninput = e => { f(e.target.value); save(); };
  bind("#bn", v => b.name = v || "Chef on Call"); bind("#bc", v => b.currency = v || "$"); bind("#bf", v => b.feePct = Math.max(0, +v || 0)); bind("#bd", v => b.depositPct = Math.min(100, Math.max(0, +v || 0)));
  armed(app.querySelector("#reset"), "Tap again to reset everything", () => { S = seed(); save(); toast("Demo reset"); V.stack = []; render(); });
};
let planSeg = "problem";
PAGES.plan = () => {
  const avg = 8 * 85, fee = avg * S.brand.feePct / 100;
  const rows = arr => arr.map(([a, b]) => `<div class="cell"><span class="grow">${a}<div class="cap muted">${b}</div></span></div>`).join("");
  const body = {
    problem: `<div><div class="list-h">Chef pain</div><div class="list">${rows([["Apps take 18–25% of every booking", "Reported in Take a Chef and Yhangry reviews"], ["Unpaid proposal work", "Several chefs write menus for one request. Most get nothing."], ["Grocery risk", "Prices move, and a late cancellation after shopping costs money"], ["Cancellations & non-payment", "Chefs share stories of chargebacks and clients who never paid"], ["Pop-ups are a gamble", "Weather and footfall swing sales from one event to the next"]])}</div></div>
      <div><div class="list-h">Guest pain</div><div class="list">${rows([["\"What will it actually cost?\"", "Groceries are often billed on top"], ["Days of back-and-forth", "Request, proposals, negotiation"], ["Trust & allergies", "A stranger in the kitchen, cooking for guests with allergies"], ["Kitchen surprises", "Nobody checked the oven or the plates"]])}</div></div>
      <div class="list-f">Sources: <a href="https://www.trustpilot.com/review/takeachef.com?page=3" target="_blank" rel="noopener">Take a Chef reviews</a>, <a href="https://www.takeachef.com/en-en/faqs" target="_blank" rel="noopener">Take a Chef FAQ</a>, <a href="https://www.trustpilot.com/review/yhangry.com?page=2" target="_blank" rel="noopener">Yhangry reviews</a>, <a href="https://yhangry.com/become-a-yhangry-chef/" target="_blank" rel="noopener">Yhangry chef page</a>, <a href="https://www.sharetribe.com/create/how-to-build-marketplace-for-personal-chefs/" target="_blank" rel="noopener">Sharetribe</a>, <a href="https://girlandthekitchen.com/faq/" target="_blank" rel="noopener">Chef FAQ</a>, <a href="https://companiesmadesimple.com/blogs/small-business-advice/start-street-food-business-uk" target="_blank" rel="noopener">Street food guide</a></div>`,
    model: `<div class="list" style="padding:14px 16px"><table class="sum num"><tr><td>Guest pays (8 × ${money(85)} + fee)</td><td>${money(avg + fee)}</td></tr><tr><td>Chef receives (100%)</td><td>${money(avg)}</td></tr><tr class="tot"><td>Platform revenue</td><td>${money(fee)}</td></tr></table></div>
      <div><div class="list-h">Revenue streams</div><div class="list">${rows([["Guest service fee", S.brand.feePct + "% on every booking"], ["Chef Pro plan", "About " + money(19) + "/month: own link, pre-orders, tools"], ["Add-ons", "Plate rental, waiters, wine partners"], ["Corporate & venues", "Offices, Airbnb hosts, villas"], ["Gift cards", "Cash up front, and they bring new guests"]])}</div></div>
      <div class="list-f">Example year one in one city: 40 chefs × 3 bookings a month ≈ ${money(40 * 3 * 12 * fee)} in fees, plus Pro plans. These are assumptions to test, not a forecast.</div>`,
    roadmap: `<div class="list" style="padding:16px">${[["M1", "Be chef #1: run your own gigs through this flow and take deposits with a payment link"], ["M2–3", "Recruit 10–20 chefs you know, give them free Pro for 6 months, and match guests by hand"], ["M3–4", "Post reels of every dinner, sign 5 Airbnb or villa partners, take pre-orders at your stall"], ["M5–6", "Once 30+ bookings come through, build the real app (start with a marketplace builder)"], ["M6+", "Pick the final brand, get terms and insurance checked by a lawyer, then open city #2"]].map(([a, b]) => `<div class="tl"><span class="t">${a}</span><span class="dot"></span><span class="fn">${b}</span></div>`).join("")}</div>`,
  };
  app.innerHTML = `<h1 class="large">Business plan</h1><div class="seg full">${[["problem", "Problem"], ["model", "Model"], ["roadmap", "Roadmap"]].map(([k, l]) => `<button data-ps="${k}" class="${planSeg === k ? "on" : ""}">${l}</button>`).join("")}</div>${body[planSeg]}`;
  app.querySelectorAll("[data-ps]").forEach(b => b.onclick = () => { planSeg = b.dataset.ps; render(); });
};

render();
</script>
</body></html>
